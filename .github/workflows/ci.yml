name: App checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
        working-directory: frontend
      - run: flutter pub get
        working-directory: frontend
      - run: flutter analyze --no-fatal-infos
        working-directory: frontend
      - run: flutter test
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-test-key-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements/development.txt
        working-directory: backend
      - run: python -m pytest tests/test_deployment.py tests/test_auth_recovery.py tests/test_public_places.py tests/test_saved_places.py tests/test_zero_cost_routing.py tests/test_planner_conversations.py tests/test_catalogue_bootstrap.py tests/test_world_discovery.py tests/test_world_locations.py tests/test_structured_itinerary.py -q
        working-directory: backend
