flutter_native_splash:

  # --------------------------------------------------
  # Base splash
  # --------------------------------------------------

  color: "#F8FAFC"
  image: assets/images/branding/trav-symbol.png

  android: true
  ios: true

  # --------------------------------------------------
  # Android 12+
  # --------------------------------------------------

  android_12:
    color: "#F8FAFC"
    image: assets/images/branding/trav-splash.png

  # --------------------------------------------------
  # iOS
  # --------------------------------------------------

  ios_content_mode: center

  # --------------------------------------------------
  # Startup behavior
  # --------------------------------------------------

  fullscreen: true