name: trav_planner
description: "AI Multi-Agent Travel Planner"
publish_to: "none"

version: 1.0.24+38

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---------- State ----------
  flutter_riverpod: ^2.6.1
  get_it: ^8.2.0

  # ---------- Routing ----------
  go_router: ^16.0.0
  
  # ---------- Splash ----------

  flutter_native_splash: ^2.4.8

  # ---------- Networking ----------
  dio: ^5.9.0
  connectivity_plus: 7.0.0
  internet_connection_checker_plus: ^2.7.2

  # ---------- Models ----------
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  uuid: ^4.5.1

  # ---------- Storage ----------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # ---------- Maps ----------
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # ---------- UI ----------
  google_fonts: ^6.3.0
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.2
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  skeletonizer: ^2.1.0+1
  fl_chart: ^1.1.1

  # ---------- Utilities ----------
  intl: ^0.20.2
  logger: ^2.6.1
  device_info_plus: 12.1.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.2
  share_plus: ^12.0.0
  image_picker: ^1.2.0
  file_picker: ^10.3.2

  # ---------- PDF ----------
  syncfusion_flutter_pdfviewer: ^31.2.18
  flutter_markdown_plus: ^1.0.12
  in_app_update: ^5.0.0
  

dev_dependencies:
  image: ^4.8.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1

 

flutter:
  uses-material-design: true

  assets:
    - assets/images/google_play_badge.png
    - assets/images/destinations/
    - assets/images/hero/
    - assets/lottie/
    - assets/images/branding/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
        - asset: assets/fonts/DMSans-800.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
